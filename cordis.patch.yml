# cloud-memory bundle patch
#
# Local-only build: this package is never published, so the row below is the
# only way the plugin reaches the desktop profile tree. The host Loader
# resolves the row `name` as a package from the profile node_modules.
- insert:
    - id: cloud-memory
      name: 'dsh-cloud-memory'
      config:
        enabled: true
        baseUrl: https://your-memory-host/api/longmemory
        clientId: dsh-desktop
        skillsSyncEnabled: true
